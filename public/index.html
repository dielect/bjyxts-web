<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="x5-fullscreen" content="true">
<meta name="full-screen" content="yes">
<title>白金英雄坛说 · 网页版</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
@font-face { font-family: "GameSong"; src: url("game/font.woff2") format("woff2"); font-display: block; }
:root { --side: 0px; --pad: 150px; --ink: #e8e4d8; --accent: #c9a45c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  font-family: "GameSong", "Songti SC", "SimSun", serif; color: var(--ink); }
body { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#screen { display: block; image-rendering: auto; background: #000; box-shadow: 0 0 0 1px #222; }
body.crisp #screen { image-rendering: pixelated; }

/* ---- touch controls ---- */
#controls { display: none; }
body.pad-on #controls { display: block; }
#dpad { position: fixed; left: calc(env(safe-area-inset-left, 0px) + (var(--side) - var(--pad)) / 2);
  top: 50%; transform: translateY(-38%); width: var(--pad); height: var(--pad); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.07) 0 30%, rgba(255,255,255,.12) 31% 100%);
  border: 1px solid rgba(255,255,255,.18); touch-action: none; z-index: 5; }
#dpad .dir { position: absolute; width: 34%; height: 34%; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.55); font-size: calc(var(--pad) * .16); border-radius: 8px; pointer-events: none; }
#dpad .dir.on { background: rgba(201,164,92,.45); color: #fff; }
#dpad .u { left: 33%; top: 2%; } #dpad .d { left: 33%; bottom: 2%; }
#dpad .l { left: 2%; top: 33%; } #dpad .r { right: 2%; top: 33%; }
#btns { position: fixed; right: calc(env(safe-area-inset-right, 0px) + (var(--side) - var(--pad)) / 2);
  top: 50%; transform: translateY(-38%); width: var(--pad); height: var(--pad); z-index: 5; }
.btn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.85);
  font-size: calc(var(--pad) * .13); touch-action: none; font-family: inherit; }
.btn.on { background: rgba(201,164,92,.55); color: #fff; }
.btn.c { width: 56%; height: 56%; right: 0; top: 10%; }
.btn.b { width: 46%; height: 46%; left: 0; bottom: 0; }
.btn.small { width: 44%; height: 20%; border-radius: 10px; font-size: calc(var(--pad) * .1); top: -22%; white-space: nowrap; }
.btn.lpage { left: 0; } .btn.rpage { right: 0; }
body.pad-overlay #dpad { left: calc(env(safe-area-inset-left, 0px) + 12px); top: auto; bottom: 12px; transform: none; opacity: .75; }
body.pad-overlay #btns { right: calc(env(safe-area-inset-right, 0px) + 12px); top: auto; bottom: 12px; transform: none; opacity: .75; }

#gear { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px);
  z-index: 8; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
  background: rgba(0,0,0,.35); color: rgba(255,255,255,.7); font-size: 20px; line-height: 36px; text-align: center; padding: 0; }

/* ---- overlays ---- */
.overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20;
  background: rgba(0,0,0,.72); }
.overlay.show { display: flex; }
.panel { background: #14120e; border: 1px solid #5a4a2a; border-radius: 10px; padding: 20px 22px; min-width: 280px;
  max-width: min(92vw, 520px); max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.panel h2 { margin: 0 0 12px; font-size: 20px; color: var(--accent); letter-spacing: 2px; }
.panel button, .panel .row button { font-family: inherit; font-size: 16px; padding: 9px 16px; margin: 4px 6px 4px 0;
  background: #2a241a; color: var(--ink); border: 1px solid #6b5833; border-radius: 6px; }
.panel button:active { background: #4a3d24; }
.row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.row label { min-width: 72px; }
input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
#dlg-text { white-space: pre-wrap; font-size: 18px; line-height: 1.6; margin-bottom: 14px; }
#dlg-input { width: 100%; font-size: 20px; padding: 8px 10px; margin-bottom: 12px; font-family: inherit;
  background: #0c0b08; color: #fff; border: 1px solid #6b5833; border-radius: 6px; -webkit-user-select: text; user-select: text; }
#dialog { z-index: 30; }

#loading:not(.show) { display: none; }
#loading { display: flex; flex-direction: column; background: #000 url("game/Graphics/Pictures/BG.png") center/cover no-repeat; z-index: 40; }
#loading::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.55); }
#loading > * { position: relative; }
#loading h1 { font-size: clamp(26px, 6vh, 44px); letter-spacing: 8px; margin: 0 0 6px; color: #f2e6c4; text-shadow: 0 2px 10px #000; }
#loading .sub { color: #bfb39a; margin-bottom: 26px; font-size: 14px; letter-spacing: 2px; }
#load-bar { width: min(70vw, 380px); height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
#load-bar-inner { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#load-text { margin-top: 10px; font-size: 14px; color: #ccc; min-height: 20px; }
#start-btn { display: none; margin-top: 18px; font-family: inherit; font-size: 22px; letter-spacing: 6px; padding: 12px 40px;
  background: rgba(201,164,92,.18); color: #f2e6c4; border: 1px solid var(--accent); border-radius: 30px; }
#loading.ready #start-btn { display: block; animation: pulse 1.6s infinite; }
#loading.ready #load-bar { display: none; }
@keyframes pulse { 50% { box-shadow: 0 0 18px rgba(201,164,92,.6); } }
.hint { margin-top: 16px; font-size: 12px; color: #999; text-align: center; line-height: 1.7; padding: 0 16px; }

#rotate { position: fixed; inset: 0; display: none; z-index: 50; background: #000; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; font-size: 18px; color: #ddd; }
body.portrait #rotate { display: flex; }
#rotate .phone { width: 46px; height: 78px; border: 3px solid #c9a45c; border-radius: 8px; margin-bottom: 22px; animation: rot 2s infinite ease-in-out; }
@keyframes rot { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(20,18,14,.92);
  border: 1px solid #5a4a2a; border-radius: 6px; padding: 8px 14px; font-size: 14px; z-index: 60; opacity: 0;
  transition: opacity .25s; pointer-events: none; }
#toast.show { opacity: 1; }
#err-text { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; max-height: 50vh; overflow: auto;
  background: #000; padding: 8px; border-radius: 4px; color: #f99; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body class="crisp-off">
<canvas id="screen" width="640" height="480"></canvas>

<div id="controls">
  <div id="dpad">
    <div class="dir u" data-code="8">▲</div><div class="dir d" data-code="2">▼</div>
    <div class="dir l" data-code="4">◀</div><div class="dir r" data-code="6">▶</div>
  </div>
  <div id="btns">
    <button class="btn small lpage" data-code="17">上页</button>
    <button class="btn small rpage" data-code="18">下页</button>
    <button class="btn c" data-code="13">确定</button>
    <button class="btn b" data-code="12">取消</button>
  </div>
</div>
<button id="gear" aria-label="设置">⚙</button>

<div id="loading" class="overlay show">
  <h1>白金英雄坛说</h1>
  <div class="sub">PC 版 V1.21 · 网页移植</div>
  <div id="load-bar"><div id="load-bar-inner"></div></div>
  <div id="load-text">正在加载…</div>
  <button id="start-btn">开始游戏</button>
  <div class="hint">电脑：方向键移动，Enter / 空格 / C 确定，Esc / X 取消，Q / W 翻页<br>手机：请横屏，左侧方向键，右侧确定 / 取消；右上角 ⚙ 可导入导出存档</div>
</div>

<div id="rotate"><div class="phone"></div>请将手机横过来<br><span style="font-size:13px;color:#999;margin-top:8px;display:block">本游戏需横屏运行</span></div>

<div id="dialog" class="overlay"><div class="panel">
  <div id="dlg-text"></div>
  <input id="dlg-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div><button id="dlg-ok">确定</button><button id="dlg-cancel">取消</button></div>
</div></div>

<div id="settings" class="overlay"><div class="panel">
  <h2>设置</h2>
  <div class="row"><label>音乐音量</label><input id="set-bgm" type="range" min="0" max="100"></div>
  <div class="row"><label>音效音量</label><input id="set-se" type="range" min="0" max="100"></div>
  <div class="row"><button id="set-full">全屏 / 退出全屏</button><button id="set-pad">显示 / 隐藏虚拟按键</button></div>
  <div class="row"><button id="set-export">导出存档</button><button id="set-import">导入存档</button><button id="set-reset">重新载入游戏</button></div>
  <div class="hint" style="text-align:left;margin:6px 0 10px">存档自动保存在本浏览器中（与 PC 版 Gmud.sav 格式相同，可互相导入）。清除浏览器数据会删除存档，建议定期导出备份。</div>
  <button id="set-close">返回游戏</button>
  <input id="import-file" type="file" accept=".sav,application/octet-stream" style="display:none">
</div></div>

<div id="ended" class="overlay"><div class="panel" style="text-align:center">
  <h2>已退出游戏</h2>
  <div style="margin-bottom:14px">进度已按游戏内的存档保存。</div>
  <button onclick="location.reload()">重新开始</button>
</div></div>

<div id="error" class="overlay"><div class="panel">
  <h2>运行出错</h2>
  <div id="err-text"></div>
  <div style="margin-top:12px"><button onclick="location.reload()">重新载入</button></div>
</div></div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
